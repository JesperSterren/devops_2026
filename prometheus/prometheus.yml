global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["http://api:3000"]
    metrics_path: "/metrics"

  - job_name: products
    static_configs:
      - targets: ["http://products:3001"]
    metrics_path: "/metrics"
